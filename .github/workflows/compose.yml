# Compose the merged docs site from the IGs in sites.json and deploy it to
# GitHub Pages from an Actions artifact: no gh-pages branch, so the built site
# never enters git history (docs/publishing-workflow.md).
#
# Needs Settings → Pages → Source: "GitHub Actions".
name: Compose and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Pages (off: build and upload the artifact only)"
        type: boolean
        default: true
  pull_request:
    paths: ["sites.json", "scripts/**", ".github/workflows/compose.yml"]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch each IG's main docs build (no previews, no branch copies)
        run: |
          set -euo pipefail
          mkdir -p _work/src
          python3 - <<'PY' > _work/igs.tsv
          import json
          c = json.load(open("sites.json"))
          for ig in c["igs"]:
              print(ig["path"], ig["repo"], ig.get("ref", "gh-pages"), sep="\t")
          PY
          excl=$(python3 -c 'import json;print("\n".join("!/"+e for e in json.load(open("sites.json"))["exclude"]))')
          while IFS=$'\t' read -r path repo ref; do
            d="_work/src/$path"
            git clone -q --depth 1 --filter=blob:none --no-checkout --branch "$ref" "https://github.com/$repo" "$d"
            git -C "$d" sparse-checkout set --no-cone '/*' $excl
            git -C "$d" checkout -q "$ref"
            echo "$path: $(du -sh "$d" --exclude=.git | cut -f1)"
          done < _work/igs.tsv

      - name: Compose
        run: python3 scripts/compose.py --sites sites.json --src _work/src --out _site --report _site/compose-report.json

      - name: Size report
        run: |
          {
            echo "### Composed site"
            echo
            echo '```'
            du -sh _site
            du -sh _site/* | sort -rh | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: compose
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
