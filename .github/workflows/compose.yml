# Compose the merged docs site from the IGs in sites.json and deploy it to
# the gh-pages branch with the platform publisher (publish-gh-pages.sh), as
# every IG site does (docs/publishing-workflow.md).
#
# Needs Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Compose and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Pages (off: build and upload the artifact only)"
        type: boolean
        default: true
  pull_request:
    paths: ["sites.json", "scripts/**", ".github/workflows/compose.yml"]

permissions:
  contents: read

env:
  # The cat-harness-tools commit whose `shared-assets.ts stage` lays out the
  # shared assets (litlfred/cat-harness-tools#1738): the PR's head until it
  # merges, then a main commit.
  TOOLS_REF: 9f7df9774465d8a4af4d533bd63ebacc8101d045
  # The layers the publisher imports, at the commits pinned beside TOOLS_REF
  # in litlfred/smart-immunizations' index.lock.json (#121).
  CAT_HARNESS_REF: 8d4c141c55199e2f1e502142279e94b3fcb492ad
  BOOTSTRAP_TOOLS_REF: 30c4585d5dfbf6960e3ecca86b18d131d6cd3921
  BOOTSTRAP_REF: 9435037232a09950ffe442bb4b00cb7da54b5985

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    permissions:
      # Pushes new keys to the `shared` branch, on a dispatch only.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch each IG's main docs build (no previews, no branch copies)
        run: |
          set -euo pipefail
          mkdir -p _work/src
          python3 - <<'PY' > _work/igs.tsv
          import json
          c = json.load(open("sites.json"))
          for ig in c["igs"]:
              print(ig["path"], ig["repo"], ig.get("ref", "gh-pages"), sep="\t")
          PY
          excl=$(python3 -c 'import json;print("\n".join("!/"+e for e in json.load(open("sites.json"))["exclude"]))')
          while IFS=$'\t' read -r path repo ref; do
            d="_work/src/$path"
            git clone -q --depth 1 --filter=blob:none --no-checkout --branch "$ref" "https://github.com/$repo" "$d"
            git -C "$d" sparse-checkout set --no-cone '/*' $excl
            git -C "$d" checkout -q "$ref"
            echo "$path: $(du -sh "$d" --exclude=.git | cut -f1)"
          done < _work/igs.tsv

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Shared assets (owner, 2026-11-09, Q-SZ-7 "A"): LHC-Forms, the editor
      # bundle and the harness images, which an IG site whose index.config.json
      # names this site as `site.sharedAssets` loads from here instead of
      # carrying. Each lands at shared/<dir>/<key>/, and the `shared` branch
      # keeps every key ever served, so a site built months ago still finds
      # its bytes. An IG build that finds its key not served keeps its own
      # copy; the next compose stages that copy from the IG's build, and the
      # IG's next build shares it.
      - name: Stage the shared assets from each IG's build
        run: |
          set -euo pipefail
          git init -q _work/tools
          git -C _work/tools fetch -q --depth 1 https://github.com/litlfred/cat-harness-tools.git "$TOOLS_REF"
          git -C _work/tools checkout -q FETCH_HEAD
          if git fetch -q --depth 1 origin shared; then
            git worktree add -q _work/shared FETCH_HEAD
          else
            git worktree add -q --orphan -b shared _work/shared
          fi
          [ -f _work/tools/scripts/shared-assets.ts ] || { echo "::error::cat-harness-tools@$TOOLS_REF has no scripts/shared-assets.ts"; exit 1; }
          for d in _work/src/*/; do
            echo "::group::${d}"
            bun run _work/tools/scripts/shared-assets.ts stage --site "$d" --out _work/shared
            echo "::endgroup::"
          done

      - name: Keep the new keys on the shared branch (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _work/shared
          git add -A shared
          if git diff --cached --quiet; then echo "no new shared key"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "shared assets: $(git diff --cached --name-only | grep -c '/.shared.json$') new key(s)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/shared

      # The landing table: every harnessed, published smart-*/dth-* repository,
      # read from the repositories themselves (scripts/catalog.py).
      - name: Build the landing-page catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/catalog.py --sites sites.json --out _work/catalog.json

      - name: Compose
        run: python3 scripts/compose.py --sites sites.json --src _work/src --out _site --report _site/compose-report.json --catalog _work/catalog.json

      - name: Serve the shared assets
        run: |
          [ -d _work/shared/shared ] && cp -r _work/shared/shared _site/shared || echo "no shared assets yet"

      - name: Size report
        run: |
          {
            echo "### Composed site"
            echo
            echo '```'
            du -sh _site
            du -sh _site/* | sort -rh | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Publishes to the gh-pages branch with the platform's own publisher,
    # cat-harness-tools/scripts/publish-gh-pages.sh, the one every folio and IG
    # site uses (owner, 2026-11-09: "Use a gh-pages branch"; standard practice).
    # Settings → Pages → Deploy from a branch → gh-pages / (root).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: compose
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact

      - name: Unpack the composed site
        run: |
          set -euo pipefail
          mkdir _site && tar -xf _artifact/artifact.tar -C _site
          touch _site/.nojekyll

      # The publisher's scripts import the layers below cat-harness-tools, so
      # they are laid down beside it at the commits smart-immunizations'
      # index.lock.json pins with the same TOOLS_REF, with one node_modules at
      # the root the way a mounted repository has it.
      - name: Fetch the platform publisher and the layers it imports
        run: |
          set -euo pipefail
          for p in "cat-harness-tools $TOOLS_REF" "cat-harness $CAT_HARNESS_REF" \
                   "bootstrap-tools $BOOTSTRAP_TOOLS_REF" "bootstrap $BOOTSTRAP_REF"; do
            set -- $p
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "https://github.com/litlfred/$1.git" "$2"
            git -C "$1" checkout -q FETCH_HEAD
          done
          (cd cat-harness-tools && bun install --ignore-scripts)
          ln -s cat-harness-tools/node_modules node_modules

      - name: Check out gh-pages (made empty the first time)
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git worktree add -q --orphan -b gh-pages _pages
            touch _pages/.nojekyll
            git -C _pages add .nojekyll
            git -C _pages commit -qm "docs(gh-pages): start the branch"
            git -C _pages push -q origin HEAD:gh-pages
          else
            git fetch -q --depth 1 origin gh-pages
            git worktree add -q _pages FETCH_HEAD
          fi

      - name: Publish
        env:
          SITE: _site
          STATE: _work/restore-staging.json
          COMMIT_SHA: ${{ github.sha }}
          PAGES_DIR: _pages
        run: |
          mkdir -p _work
          bash cat-harness-tools/scripts/publish-gh-pages.sh
